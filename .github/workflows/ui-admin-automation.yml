name: Admin UI automation
run-name: Admin UI automation (${{ inputs.use_mock_ui && 'mock UI' || inputs.target_url || 'environment target' }}${{ inputs.profile && format(', {0}', inputs.profile) || '' }})

# The TUnit + Playwright suite of src/Platform/UI.Admin.AutomationTests against a deployed admin UI (target_url, or the
# environment ui-admin-automation), or against the admin UI's mock build served in the job (use_mock_ui), which needs
# no secret and runs on any branch. Run by hand or called by another workflow; it has no push or pull request trigger
# (gating pull requests on the Elementary set is a follow-up). Spec: docs/Platform/UI.Admin.AutomationTests/specs/
# 2026-10-31 UI Automation Testing Project.md, section 9; usage: docs/Platform/UI.Admin.AutomationTests/
# automation-tests.md. Restrict the environment ui-admin-automation (Settings > Environments > Deployment branches and
# tags) to main: its secrets are the pool users' passwords and the BrowserStack and Testiny keys, and a workflow run of
# another branch could otherwise read them.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Settings profiles, comma-separated (mobile, firefox, webkit, browserstack-win-chrome, browserstack-mac-safari); empty for the base settings
        required: false
        type: string
        default: ''
      filter:
        description: TUnit tree node filter; empty runs every test
        required: false
        type: string
        default: '/**[Category=Elementary]'
      target_url:
        description: The admin UI to test; empty for the environment's UITESTS_TARGET_BASE_URL (not used with use_mock_ui)
        required: false
        type: string
        default: ''
      report_testiny:
        description: Report the run to Testiny (the environment's project and API key)
        required: false
        type: boolean
        default: false
      use_mock_ui:
        description: Build the admin UI's mock build and test it in the job (no secrets, any branch)
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: ''
      filter:
        required: false
        type: string
        default: '/**[Category=Elementary]'
      target_url:
        required: false
        type: string
        default: ''
      report_testiny:
        required: false
        type: boolean
        default: false
      use_mock_ui:
        required: false
        type: boolean
        default: false
    # A secret of the environment ui-admin-automation wins over the one a caller passes.
    secrets:
      UITESTS_USER_0_PASSWORD:
        required: false
      UITESTS_USER_1_PASSWORD:
        required: false
      UITESTS_USER_2_PASSWORD:
        required: false
      UITESTS_USER_3_PASSWORD:
        required: false
      UITESTS_USER_4_PASSWORD:
        required: false
      UITESTS_USER_5_PASSWORD:
        required: false
      UITESTS_USER_6_PASSWORD:
        required: false
      UITESTS_USER_7_PASSWORD:
        required: false
      UITESTS_BROWSERSTACK_USERNAME:
        required: false
      UITESTS_BROWSERSTACK_ACCESS_KEY:
        required: false
      UITESTS_TESTINY_API_KEY:
        required: false

# Runs against a deployed target share its pool users (a user's sign-in is not shared between two runs), so they share
# one group (every deployed target the same one); mock runs share one per branch. One run of a group runs at a time; up
# to 100 wait, first in, first out (queue: max; without it a newer waiting run would cancel the one already waiting). A
# running run is never cancelled.
concurrency:
  group: ui-admin-automation-${{ inputs.use_mock_ui && format('mock-{0}', github.ref) || 'target' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # The Microsoft.Playwright version of Directory.Packages.props, and so of the container image below and its browsers.
  PLAYWRIGHT_VERSION: 1.63.0
  PROJECT: src/Platform/UI.Admin.AutomationTests/src
  SDK_DIR: src/Platform/Storyteller/sdk.typescript/src
  UI_DIR: src/Platform/ui.admin/src
  RESULTS_DIR: TestResults/ui-admin-automation
  MOCK_UI_URL: http://localhost:4174

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: UI automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The variables and secrets of a deployed target and of Testiny; a mock run without reporting needs none, so it gets
    # no environment (and none of its protection rules).
    environment: ${{ (!inputs.use_mock_ui || inputs.report_testiny) && 'ui-admin-automation' || '' }}
    # Playwright's .NET image of the pinned version: its browsers are the ones the client expects, and its .NET SDK
    # (10.0.4xx) satisfies global.json. As the runner's user (1001, Playwright's own CI setup): the image's default user
    # is root, and Firefox refuses to start as root with HOME (/github/home) owned by another user. The workspace, the
    # tool cache and HOME belong to 1001, and the browsers in /ms-playwright are readable by anyone.
    container:
      image: mcr.microsoft.com/playwright/dotnet:v1.63.0-noble
      options: --ipc=host --user 1001
    # Inputs and variables reach the scripts only through env:, never as ${{ }} in a script; only the Run step gets the
    # secrets (its env:), so no install script, action or build step sees them.
    env:
      PROFILE: ${{ inputs.profile }}
      FILTER: ${{ inputs.filter }}
      TARGET_URL: ${{ inputs.target_url }}
      REPORT_TESTINY: ${{ inputs.report_testiny }}
      USE_MOCK_UI: ${{ inputs.use_mock_ui }}
      # TUnit's own block in the step summary (one suite, so no merged report in RUNNER_TEMP); its HTML report stays in
      # the results directory, and the artifact below is the only upload.
      TUNIT_GITHUB_REPORTER_STYLE: collapsible
      TUNIT_AGGREGATE_REPORTS: 'off'
      TUNIT_DISABLE_ARTIFACT_UPLOAD: 'true'
      CI_TARGET_BASE_URL: ${{ vars.UITESTS_TARGET_BASE_URL }}
    steps:
      # A profile list may have spaces after its commas (the settings loader trims each entry).
      - name: Check the inputs
        run: |
          profiles=",${PROFILE// /},"
          case "$profiles" in
            *,browserstack*)
              if [ "$USE_MOCK_UI" = true ]; then
                echo "::error::A browserstack profile cannot test the mock UI of the job: BrowserStack's browsers reach it only through BrowserStack Local. Test a deployed target instead."
                exit 1
              fi
              ;;
          esac
          if [ "$USE_MOCK_UI" != true ] && [ -z "$TARGET_URL" ] && [ -z "$CI_TARGET_BASE_URL" ]; then
            echo "::error::No target: set the target_url input or the variable UITESTS_TARGET_BASE_URL of the environment ui-admin-automation, or run with use_mock_ui."
            exit 1
          fi

      # The whole history: the versioning of the build fails on a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The job's image cannot come from env: (no expression context there), so the step reads its literal from this file.
      - name: Playwright version matches the image
        run: |
          pinned=$(grep -o '<PackageVersion Include="Microsoft.Playwright" Version="[^"]*"' Directory.Packages.props | sed 's/.*Version="\([^"]*\)"/\1/')
          image=$(grep -E '^[[:space:]]*image:[[:space:]]*mcr\.microsoft\.com/playwright/dotnet:' .github/workflows/ui-admin-automation.yml | grep -oE 'mcr\.microsoft\.com/playwright/dotnet:[^[:space:]]+' | head -n 1)
          echo "Microsoft.Playwright $pinned, PLAYWRIGHT_VERSION $PLAYWRIGHT_VERSION, image $image"
          if [ "$pinned" != "$PLAYWRIGHT_VERSION" ] || [ "$image" != "mcr.microsoft.com/playwright/dotnet:v$PLAYWRIGHT_VERSION-noble" ]; then
            echo "::error::Directory.Packages.props pins Microsoft.Playwright $pinned, PLAYWRIGHT_VERSION is $PLAYWRIGHT_VERSION and the job's image is $image; set all three to the same version (the image mcr.microsoft.com/playwright/dotnet:v<version>-noble)."
            exit 1
          fi
          dotnet --version

      - uses: actions/setup-node@v4
        if: inputs.use_mock_ui
        with:
          node-version-file: src/Platform/ui.admin/src/.nvmrc
          cache: npm
          cache-dependency-path: |
            src/Platform/Storyteller/sdk.typescript/src/package-lock.json
            src/Platform/ui.admin/src/package-lock.json

      # dist/ of the SDK is not committed and the UI installs it as a packed copy, so the SDK is built first.
      - name: Mock UI – install and build
        if: inputs.use_mock_ui
        env:
          VITE_MOCK_DATASET: default
        run: |
          npm install --global npm@11
          (cd "$SDK_DIR" && npm ci && npm run build)
          (cd "$UI_DIR" && npm ci && npm run build:e2e)

      # The e2e build with the MSW mock API and Ada Lovelace signed in, as the admin UI's Playwright suite serves it.
      - name: Mock UI – serve
        if: inputs.use_mock_ui
        working-directory: ${{ env.UI_DIR }}
        run: |
          nohup npx vite preview --port 4174 --strictPort > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null "$MOCK_UI_URL"; then
              echo "The mock UI answers at $MOCK_UI_URL."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/vite-preview.log"
          echo "::error::The mock UI did not start at $MOCK_UI_URL."
          exit 1

      - name: Build
        run: dotnet build "$PROJECT" -c Release

      # The settings: the profiles, the target and its pool users (only the variables that are set, so a profile's
      # values stay), the BrowserStack credentials (with a browserstack profile) and the Testiny ones (with
      # report_testiny); then the run, its log in the results. The only step with the secrets, and only with those its
      # path needs: no password or BrowserStack key for the mock UI, no Testiny key without report_testiny, also when
      # a caller passes every secret (secrets: inherit); the CI_* copies are unset before the tests start.
      - name: Run
        env:
          CI_TARGET_ORGANIZATION: ${{ vars.UITESTS_TARGET_ORGANIZATION }}
          CI_TARGET_PROJECT: ${{ vars.UITESTS_TARGET_PROJECT }}
          CI_TARGET_VIEW: ${{ vars.UITESTS_TARGET_VIEW }}
          CI_TARGET_EMAIL_DOMAIN: ${{ vars.UITESTS_TARGET_EMAIL_DOMAIN }}
          CI_USER_0_EMAIL: ${{ vars.UITESTS_USER_0_EMAIL }}
          CI_USER_0_ROLES: ${{ vars.UITESTS_USER_0_ROLES }}
          CI_USER_0_PASSWORD: ${{ !inputs.use_mock_ui && secrets.UITESTS_USER_0_PASSWORD || '' }}
          CI_USER_1_EMAIL: ${{ vars.UITESTS_USER_1_EMAIL }}
          CI_USER_1_ROLES: ${{ vars.UITESTS_USER_1_ROLES }}
          CI_USER_1_PASSWORD: ${{ !inputs.use_mock_ui && secrets.UITESTS_USER_1_PASSWORD || '' }}
          CI_USER_2_EMAIL: ${{ vars.UITESTS_USER_2_EMAIL }}
          CI_USER_2_ROLES: ${{ vars.UITESTS_USER_2_ROLES }}
          CI_USER_2_PASSWORD: ${{ !inputs.use_mock_ui && secrets.UITESTS_USER_2_PASSWORD || '' }}
          CI_USER_3_EMAIL: ${{ vars.UITESTS_USER_3_EMAIL }}
          CI_USER_3_ROLES: ${{ vars.UITESTS_USER_3_ROLES }}
          CI_USER_3_PASSWORD: ${{ !inputs.use_mock_ui && secrets.UITESTS_USER_3_PASSWORD || '' }}
          CI_USER_4_EMAIL: ${{ vars.UITESTS_USER_4_EMAIL }}
          CI_USER_4_ROLES: ${{ vars.UITESTS_USER_4_ROLES }}
          CI_USER_4_PASSWORD: ${{ !inputs.use_mock_ui && secrets.UITESTS_USER_4_PASSWORD || '' }}
          CI_USER_5_EMAIL: ${{ vars.UITESTS_USER_5_EMAIL }}
          CI_USER_5_ROLES: ${{ vars.UITESTS_USER_5_ROLES }}
          CI_USER_5_PASSWORD: ${{ !inputs.use_mock_ui && secrets.UITESTS_USER_5_PASSWORD || '' }}
          CI_USER_6_EMAIL: ${{ vars.UITESTS_USER_6_EMAIL }}
          CI_USER_6_ROLES: ${{ vars.UITESTS_USER_6_ROLES }}
          CI_USER_6_PASSWORD: ${{ !inputs.use_mock_ui && secrets.UITESTS_USER_6_PASSWORD || '' }}
          CI_USER_7_EMAIL: ${{ vars.UITESTS_USER_7_EMAIL }}
          CI_USER_7_ROLES: ${{ vars.UITESTS_USER_7_ROLES }}
          CI_USER_7_PASSWORD: ${{ !inputs.use_mock_ui && secrets.UITESTS_USER_7_PASSWORD || '' }}
          CI_BROWSERSTACK_USERNAME: ${{ !inputs.use_mock_ui && contains(inputs.profile, 'browserstack') && secrets.UITESTS_BROWSERSTACK_USERNAME || '' }}
          CI_BROWSERSTACK_ACCESS_KEY: ${{ !inputs.use_mock_ui && contains(inputs.profile, 'browserstack') && secrets.UITESTS_BROWSERSTACK_ACCESS_KEY || '' }}
          CI_BROWSERSTACK_MAX_PARALLEL_SESSIONS: ${{ vars.UITESTS_BROWSERSTACK_MAX_PARALLEL_SESSIONS }}
          CI_TESTINY_PROJECT_ID: ${{ vars.UITESTS_TESTINY_PROJECT_ID }}
          CI_TESTINY_TEST_PLAN_ID: ${{ vars.UITESTS_TESTINY_TEST_PLAN_ID }}
          CI_TESTINY_API_KEY: ${{ inputs.report_testiny && secrets.UITESTS_TESTINY_API_KEY || '' }}
        run: |
          results="$GITHUB_WORKSPACE/$RESULTS_DIR"
          mkdir -p "$results"
          export UITESTS_Execution__ArtifactsPath="$results/artifacts"

          set_if() {
            if [ -n "$2" ]; then
              export "$1=$2"
            fi
          }

          profiles="${PROFILE// /}"
          if [ "$USE_MOCK_UI" = true ]; then
            profiles="mock${profiles:+,$profiles}"
            export UITESTS_Target__BaseUrl="$MOCK_UI_URL"
          else
            export UITESTS_Target__BaseUrl="${TARGET_URL:-$CI_TARGET_BASE_URL}"
            set_if UITESTS_Target__Organization "$CI_TARGET_ORGANIZATION"
            set_if UITESTS_Target__Project "$CI_TARGET_PROJECT"
            set_if UITESTS_Target__View "$CI_TARGET_VIEW"
            set_if UITESTS_Target__EmailDomain "$CI_TARGET_EMAIL_DOMAIN"
            # A password applies by index to the pool; any UITESTS_USER_<n>_EMAIL makes the variables' entries replace
            # the committed pool of testsettings.json entirely (the highest layer with an e-mail defines the pool).
            for index in 0 1 2 3 4 5 6 7; do
              email_name="CI_USER_${index}_EMAIL"
              roles_name="CI_USER_${index}_ROLES"
              password_name="CI_USER_${index}_PASSWORD"
              set_if "UITESTS_Users__Pool__${index}__Password" "${!password_name}"
              if [ -z "${!email_name}" ]; then
                continue
              fi
              export "UITESTS_Users__Pool__${index}__Email=${!email_name}"
              role_index=0
              IFS=',' read -ra roles <<< "${!roles_name}"
              for role in "${roles[@]}"; do
                role="${role// /}"
                if [ -n "$role" ]; then
                  export "UITESTS_Users__Pool__${index}__Roles__${role_index}=$role"
                  role_index=$((role_index + 1))
                fi
              done
            done
            case ",$profiles," in
              *,browserstack*)
                set_if UITESTS_BrowserStack__Username "$CI_BROWSERSTACK_USERNAME"
                set_if UITESTS_BrowserStack__AccessKey "$CI_BROWSERSTACK_ACCESS_KEY"
                set_if UITESTS_BrowserStack__MaxParallelSessions "$CI_BROWSERSTACK_MAX_PARALLEL_SESSIONS"
                ;;
            esac
          fi

          if [ "$REPORT_TESTINY" = true ]; then
            profiles="${profiles:+$profiles,}reporting-testiny"
            set_if UITESTS_Reporting__Testiny__ProjectId "$CI_TESTINY_PROJECT_ID"
            set_if UITESTS_Reporting__Testiny__TestPlanId "$CI_TESTINY_TEST_PLAN_ID"
            set_if UITESTS_Reporting__Testiny__ApiKey "$CI_TESTINY_API_KEY"
          fi
          set_if UITESTS_PROFILE "$profiles"

          # The test process gets the secrets only as the UITESTS_* settings set above.
          unset CI_USER_0_PASSWORD CI_USER_1_PASSWORD CI_USER_2_PASSWORD CI_USER_3_PASSWORD CI_USER_4_PASSWORD CI_USER_5_PASSWORD \n            CI_USER_6_PASSWORD CI_USER_7_PASSWORD \
            CI_BROWSERSTACK_USERNAME CI_BROWSERSTACK_ACCESS_KEY CI_TESTINY_API_KEY

          arguments=(--report-trx --results-directory "$results")
          if [ -n "$FILTER" ]; then
            arguments=(--treenode-filter "$FILTER" "${arguments[@]}")
          fi

          # --no-build: the Build step built it, so no package's build targets run in this step, which has the secrets.
          set +e
          dotnet run --project "$PROJECT" -c Release --no-build -- "${arguments[@]}" 2>&1 | tee "$results/run.log"
          code=${PIPESTATUS[0]}
          set -e

          # The run URL every reporter printed (e.g. "ui-automation: Testiny run: https://…"), under TUnit's summary.
          if grep -qE '^ui-automation: [A-Za-z]+ run: https?://' "$results/run.log"; then
            {
              echo
              echo '### Test case management'
              grep -E '^ui-automation: [A-Za-z]+ run: https?://' "$results/run.log" | sed -E 's|^ui-automation: ([A-Za-z]+) run: (https?://[^ ]+).*$|- \1: [\2](\2)|'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      # A trace holds the session cookies and tokens of the pool user; artifacts of this public repository are readable
      # by anyone, so a deployed target's traces never go into the artifact (the mock UI's user is fake, so its traces
      # stay). Every .zip goes: the TRX copies of a retried test's traces are trace_1.zip and so on. Also after a
      # cancelled run (timeout-minutes included), on the same condition as the upload.
      - name: Keep the traces private
        if: (failure() || cancelled()) && !inputs.use_mock_ui
        run: |
          if [ -d "$RESULTS_DIR" ]; then
            find "$RESULTS_DIR" -type f -name '*.zip' -print -delete
          fi

      - name: Upload the test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ui-admin-automation-${{ inputs.use_mock_ui && 'mock' || 'target' }}-${{ inputs.profile || 'base' }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: ignore
          retention-days: 7
