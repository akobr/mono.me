name: Platform.Storyteller.CosmosDb

# The Cosmos DB suites of the Storyteller backend (Backend.CosmosDb/test, Access.Certificates/testint and
# DbCreator/testint, the seed of data sets) on Testcontainers emulators. The vNext job is the everyday run: the light
# Linux emulator, without the tests that only the engine of the service answers right (the trait Emulator=Classic:
# request charges, stored sizes, expiry timing, the paging of an ORDER BY query from a Linux client, which vNext answers
# in one page). The classic job runs the whole suites on the classic Linux emulator, which charges request units and
# enforces the indexing policy like Azure, so an ORDER BY on an excluded path or a costlier query fails here. Spec:
# docs/Platform/Storyteller/specs/2026-11-09 Shared Organization Container.md, sections 8 and 10. On a pull request the
# classic job runs only the Emulator=Classic tests (Backend.CosmosDb has them, the two integration suites none); by
# hand or called, the whole suites. The vNext job also runs the unit tests of DbCreator (no emulator): no other workflow
# runs the Storyteller unit tests, and the seed's integration suite builds on them.
on:
  pull_request:
    paths:
      - src/Platform/Storyteller/**
      - src/Platform/version.json
      - src/.stylecop/**
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
      - nuget.config
      - stylecop.json
      - version.json
      - .github/workflows/Platform.Storyteller.CosmosDb.yml
  workflow_dispatch:
  workflow_call:

concurrency:
  group: storyteller-cosmos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  STORYTELLER_TESTS_USE_CONTAINER: 'true'
  BACKEND_TESTS: src/Platform/Storyteller/Backend.CosmosDb/test/Backend.CosmosDb.UnitTests.csproj
  CERTIFICATE_TESTS: src/Platform/Storyteller/Access.Certificates/testint/Access.Certificates.IntegrationTests.csproj
  DBCREATOR_TESTS: src/Platform/Storyteller/DbCreator/testint/DbCreator.IntegrationTests.csproj
  DBCREATOR_UNIT_TESTS: src/Platform/Storyteller/DbCreator/test/DbCreator.UnitTests.csproj

defaults:
  run:
    shell: bash

jobs:
  vnext:
    name: vNext emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STORYTELLER_TESTS_EMULATOR: vnext
    steps:
      # The whole history: the versioning of the build fails on a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # One module at a time: each starts its own emulator container.
      - name: Backend.CosmosDb
        run: dotnet test --project "$BACKEND_TESTS" --filter-not-trait "Emulator=Classic" --report-trx --results-directory TestResults/backend

      - name: Access.Certificates integration
        run: dotnet test --project "$CERTIFICATE_TESTS" --filter-not-trait "Emulator=Classic" --report-trx --results-directory TestResults/certificates

      - name: DbCreator integration
        run: dotnet test --project "$DBCREATOR_TESTS" --filter-not-trait "Emulator=Classic" --report-trx --results-directory TestResults/dbcreator

      # No emulator: the set files, the catalog, the seeder over fakes and the commands. It runs also when a suite above
      # failed, since no other workflow runs these tests. Not first: a failure of its own would skip the suites instead.
      - name: DbCreator unit
        if: ${{ !cancelled() }}
        run: dotnet test --project "$DBCREATOR_UNIT_TESTS" --report-trx --results-directory TestResults/dbcreator-unit

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyteller-cosmos-vnext
          path: TestResults
          if-no-files-found: ignore

  classic:
    name: Classic emulator
    # The classic emulator image is x64 only.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STORYTELLER_TESTS_EMULATOR: classic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # A pull request runs the tests only this emulator answers right; the whole suites run by hand or when called.
      - name: Backend.CosmosDb
        env:
          TRAIT_FILTER: ${{ github.event_name == 'pull_request' && '--filter-trait Emulator=Classic' || '' }}
        run: dotnet test --project "$BACKEND_TESTS" $TRAIT_FILTER --report-trx --results-directory TestResults/backend

      # Its suite has no Emulator=Classic tests (a module without tests fails the run).
      - name: Access.Certificates integration
        if: github.event_name != 'pull_request'
        run: dotnet test --project "$CERTIFICATE_TESTS" --report-trx --results-directory TestResults/certificates

      # Its suite has no Emulator=Classic tests either.
      - name: DbCreator integration
        if: github.event_name != 'pull_request'
        run: dotnet test --project "$DBCREATOR_TESTS" --report-trx --results-directory TestResults/dbcreator

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyteller-cosmos-classic
          path: TestResults
          if-no-files-found: ignore
