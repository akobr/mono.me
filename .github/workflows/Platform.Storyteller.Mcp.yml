name: Platform.Storyteller.Mcp

# The MCP server (src/Platform/Storyteller/Mcp): its unit tests on every pull request and push to main that touches it or
# a project it builds on. On main (a push, or by hand) also its container image, built by the .NET SDK without a
# Dockerfile and pushed to ghcr.io/akobr/2s-platform-mcp with the commit as its tag, and then, after the approval of the
# environment prod.42.Platform, that image by its digest on the Container App (az containerapp update --image, as the
# deployment identity, which has Container Apps Contributor on that Container App only). The image holds no setting and
# no secret: the Container App gives them. docs/Platform/Deployment/runbook-mcp-server.md.
#
# The version files (version.json, src/Platform/version.json) are left out of the paths on purpose: a version bump alone
# would ask for a production deployment of the same code.
on:
  pull_request:
    paths:
      - 'src/Platform/Storyteller/Mcp/**'
      - 'src/Platform/Storyteller/Sdk.NSwag/**'
      - 'src/Platform/Storyteller/Abstractions.Annotations/**'
      - 'src/Platform/Storyteller/KeyValues.ClientEncryption/**'
      - 'src/Platform/Storyteller/conformance/project-settings.json'
      - 'src/Platform/Aspire.ServiceDefaults/**'
      - 'src/.stylecop/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - 'stylecop.json'
      - '.github/workflows/Platform.Storyteller.Mcp.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/Platform/Storyteller/Mcp/**'
      - 'src/Platform/Storyteller/Sdk.NSwag/**'
      - 'src/Platform/Storyteller/Abstractions.Annotations/**'
      - 'src/Platform/Storyteller/KeyValues.ClientEncryption/**'
      - 'src/Platform/Storyteller/conformance/project-settings.json'
      - 'src/Platform/Aspire.ServiceDefaults/**'
      - 'src/.stylecop/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - 'stylecop.json'
      - '.github/workflows/Platform.Storyteller.Mcp.yml'
  # A redeployment of main: an existing image of the commit is reused, not built again.
  workflow_dispatch:

# A newer pull request run replaces an older one. Runs of main don't wait for each other here, so a deployment that waits
# for its approval doesn't hold back the tests and images of later merges; the deploy job queues on its own group.
concurrency:
  group: platform-storyteller-mcp-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # ContainerRegistry (here) and ContainerRepository (Mcp.csproj).
  IMAGE_NAME: ghcr.io/akobr/2s-platform-mcp

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history: the versioning of the build fails on a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: MCP server unit tests
        run: dotnet test --project src/Platform/Storyteller/Mcp/test

  image:
    name: Container image
    needs: test
    # Only main is ever built into an image; a manual run of another branch tests it and stops here.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two runs of one commit (a push and a manual run) look for, build and read its image one after the other, so the
    # commit's tag is pushed once; runs of other commits go on in parallel.
    concurrency:
      group: platform-storyteller-mcp-image-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      # The SDK pushes with the credentials docker login stores. The first push links the package to this repository;
      # if it comes out private, make it public once in its settings (runbook, phase 3), so the Container App pulls it
      # without a credential.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A commit is built once: its tag never moves after a rerun or a redeployment, so a rollback to it gets the same
      # image, and the deployment pins the digest anyway. Only a registry answer that the tag (or the package, before its
      # first push) doesn't exist counts as absent; any other failure is retried, then stops the job without a build.
      - name: Look for the commit's image
        id: existing
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if output=$(docker buildx imagetools inspect "${IMAGE_NAME}:${GITHUB_SHA}" 2>&1); then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Reusing \`${IMAGE_NAME}:${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if grep -qiE 'not found|manifest unknown|name unknown|denied' <<< "$output"; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "The registry didn't answer (attempt $attempt): $output"
            sleep $((attempt * 10))
          done

          echo "::error::Could not tell whether ${IMAGE_NAME}:${GITHUB_SHA} exists; nothing was built."
          exit 1

      - uses: actions/checkout@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          global-json-file: global.json

      # One tag, the commit: nothing uses a moving tag, and runs of main may finish out of order.
      - name: Build and push the image
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          dotnet publish src/Platform/Storyteller/Mcp/src -c Release --os linux --arch x64 \
            -t:PublishContainer -p:ContainerRegistry=ghcr.io "-p:ContainerImageTag=${GITHUB_SHA}"
          echo "Pushed \`${IMAGE_NAME}:${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"

      # The deployment runs the image by its digest: what the reviewer approves is what every replica pulls.
      - name: Read the digest
        id: digest
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE_NAME}:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r '.digest')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No digest for ${IMAGE_NAME}:${GITHUB_SHA} (got '$digest')."
            exit 1
          fi

          echo "image=${IMAGE_NAME}@${digest}" >> "$GITHUB_OUTPUT"
          echo "\`${IMAGE_NAME}:${GITHUB_SHA}\` is \`${IMAGE_NAME}@${digest}\`." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to the Container App
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # A required reviewer and the branch main only; its federated credential is the deployment identity's.
    environment: prod.42.Platform
    # One deployment at a time. A newer one that waits replaces an older waiting one; approve only the newest.
    concurrency:
      group: platform-storyteller-mcp-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_MCP_APP_NAME }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Check the environment's variables
        run: |
          if [ -z "$APP_NAME" ] || [ -z "$RESOURCE_GROUP" ]; then
            echo "::error::AZURE_MCP_APP_NAME and AZURE_RESOURCE_GROUP of the environment prod.42.Platform must be set (Set-GitHubEnvironment.ps1; runbook-mcp-server.md, phase 8)."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Only the image changes: az containerapp update PATCHes the containers alone (no environment, no identity), which
      # Container Apps Contributor on the app allows. The settings belong to main.bicep, which keeps this image on its
      # later runs. A suffix per run gives a new revision even for an image that runs already (a redeployment).
      # --no-wait: the CLI's own wait polls an operation at subscription scope, where the identity has no role; the next
      # step polls the app instead.
      - name: Run the new image
        id: update
        run: |
          set -euo pipefail
          previous=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --query "properties.template.containers[0].image" -o tsv)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          suffix="gh${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --image "$IMAGE" \
            --revision-suffix "$suffix" --no-wait --output none
          echo "REVISION_SUFFIX=$suffix" >> "$GITHUB_ENV"

      # The revision of the new image serves once it is provisioned and the latest ready one (single revision mode moves
      # all traffic to it then). Then the resource metadata, built from Mcp:ResourceUrl, must answer at the public URL,
      # which also wakes the app from zero replicas and so proves that the new image starts.
      - name: Check the new revision
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          while true; do
            app=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
              --query "{state: properties.provisioningState, latest: properties.latestRevisionName, ready: properties.latestReadyRevisionName, image: properties.template.containers[0].image, resourceUrl: properties.template.containers[0].env[?name=='Mcp__ResourceUrl'].value | [0]}" -o json)
            state=$(jq -r '.state // ""' <<< "$app")
            latest=$(jq -r '.latest // ""' <<< "$app")
            ready=$(jq -r '.ready // ""' <<< "$app")

            if [ "$state" = "Failed" ]; then
              echo "::error::The update of $APP_NAME failed; see az containerapp logs show --type system."
              exit 1
            fi

            if [[ "$latest" == *"--${REVISION_SUFFIX}" ]]; then
              revision=$(az containerapp revision show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --revision "$latest" \
                --query "{provisioning: properties.provisioningState, running: properties.runningState}" -o json)
              provisioning=$(jq -r '.provisioning // ""' <<< "$revision")
              running=$(jq -r '.running // ""' <<< "$revision")
              echo "App $state, revision $latest $provisioning/$running, the latest ready one ${ready:-none}"

              if [ "$provisioning" = "Failed" ] || [ "$running" = "Failed" ] || [ "$running" = "Degraded" ]; then
                echo "::error::The revision $latest is $provisioning/$running; see az containerapp logs show --type system."
                exit 1
              fi

              if [ "$state" = "Succeeded" ] && [ "$provisioning" = "Provisioned" ] && [ "$ready" = "$latest" ]; then
                break
              fi
            else
              echo "App $state, waiting for the revision *--${REVISION_SUFFIX} (the latest is ${latest:-none})"
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The revision of $IMAGE is not ready after 15 minutes."
              exit 1
            fi

            sleep 10
          done

          image=$(jq -r '.image // ""' <<< "$app")
          if [ "$image" != "$IMAGE" ]; then
            echo "::error::The Container App runs $image, not $IMAGE."
            exit 1
          fi

          resource_url=$(jq -r '.resourceUrl // ""' <<< "$app")
          origin=$(sed -E 's#^(https://[^/]+).*$#\1#' <<< "$resource_url")
          metadata_url="${origin}/.well-known/oauth-protected-resource${resource_url#"$origin"}"
          echo "Revision $latest is ready; reading $metadata_url"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --max-time 30 "$metadata_url" \
            | jq -e --arg url "$resource_url" '.resource == $url' > /dev/null
          echo "The MCP server runs \`$IMAGE\` (the commit \`${GITHUB_SHA}\`) as revision \`$latest\` at $resource_url." >> "$GITHUB_STEP_SUMMARY"

      # A failed check leaves the image that ran before, not the new one: main.bicep would otherwise keep the new image
      # on its later runs too. Nothing is rolled back when the previous image is the new one (a redeployment).
      - name: Roll back to the previous image
        if: failure() && steps.update.outputs.previous != '' && steps.update.outputs.previous != env.IMAGE
        env:
          PREVIOUS: ${{ steps.update.outputs.previous }}
        run: |
          set -euo pipefail
          suffix="gh${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-rb"
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --image "$PREVIOUS" \
            --revision-suffix "$suffix" --no-wait --output none

          # The job stays failed either way; this only says whether the previous image serves again. Bounded to
          # 10 minutes, within the job's timeout after the check's 15.
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            app=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
              --query "{latest: properties.latestRevisionName, ready: properties.latestReadyRevisionName}" -o json)
            latest=$(jq -r '.latest // ""' <<< "$app")
            ready=$(jq -r '.ready // ""' <<< "$app")
            if [[ "$latest" == *"--${suffix}" ]] && [ "$ready" = "$latest" ]; then
              echo "::warning::The check failed; the Container App runs $PREVIOUS again (revision $latest)."
              echo "Rolled back to \`$PREVIOUS\` (revision \`$latest\`) after the failed check of \`$IMAGE\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            sleep 10
          done

          echo "::error::The rollback to $PREVIOUS was submitted but its revision is not ready after 10 minutes; check az containerapp revision list."
          echo "The rollback to \`$PREVIOUS\` was submitted but is not ready; check the revisions by hand." >> "$GITHUB_STEP_SUMMARY"
          exit 1
